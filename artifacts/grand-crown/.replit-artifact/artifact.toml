kind = "web"
previewPath = "/"
title = "Grand Crown Platform"
description = "A responsive Grand Crown customer and administrator platform for account access, product purchases, referral earnings, manual mobile-money verification, and withdrawal management."
version = "1.0.0"
id = "artifacts/grand-crown"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20435

[services.development]
run = "pnpm --filter @workspace/grand-crown run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/grand-crown", "run", "build" ]
serve = "static"
publicDir = "artifacts/grand-crown/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20435"
BASE_PATH = "/"
